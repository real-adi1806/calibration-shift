name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: The README example still says what the README says
        run: |
          calshift audit examples/cimt_heldout.csv --json > audit.json
          python - <<'PY'
          import json
          r = json.load(open("audit.json"))
          assert abs(r["auc"] - 0.894711) < 5e-7, r["auc"]
          assert abs(r["observed_over_expected"] - 0.7188) < 5e-5, r["observed_over_expected"]
          assert abs(r["calibration_slope"] - 1.3106) < 5e-5, r["calibration_slope"]
          print("README example holds")
          PY
